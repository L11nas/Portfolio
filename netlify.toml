# Netlify: kompiliavimas su prerender (scripts/prerender.mjs) ir naršyklės talpyklos antraštės
[build]
  command = "npm run build"
  publish = "dist"

# Failai su hash pavadinime niekada nesikeičia – galima saugoti metus
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
